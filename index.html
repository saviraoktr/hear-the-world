
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hear the World</title>

    <style>
        /* ========================================
           1. GENERAL PAGE STYLING
        ======================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f0;
            font-family: Arial, sans-serif;
            color: #282b25;
        }

        /* ========================================
           2. MAIN CONTAINER
        ======================================== */

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 24px 16px;
        }

        /* ========================================
           3. PAGE HEADING
        ======================================== */

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
        }

        /* ========================================
           4. SCRATCH GAME PLAYER
        ======================================== */

        iframe {
            display: block;
            width: min(485px, calc(100vw - 32px));
            height: 402px;
            border: none;
            border-radius: 8px;
        }

        /* ========================================
           5. RESPONSIVE DESIGN
        ======================================== */

        @media (max-width: 517px) {
            iframe {
                height: calc((100vw - 32px) * 0.83);
            }

            h1 {
                font-size: 26px;
            }
        }

    </style>
</head>

<body>

    <main class="game-container">

        <h1>Hear the World</h1>

        <iframe
            src="https://turbowarp.org/embed?project_url=https%3A%2F%2Fsaviraoktr.github.io%2Fhear-the-world%2Fhear%20the%20world.sb3"
            allowtransparency="true"
            scrolling="no"
            allowfullscreen>
        </iframe>

    </main>

</body>
</html>
